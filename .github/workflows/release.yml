name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-tag:
    name: verify tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "tag=$TAG cargo=$CARGO_VERSION"
          test "$TAG" = "$CARGO_VERSION" || {
            echo "::error::tag v$TAG does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          }

  build:
    name: build & package (${{ matrix.name }})
    needs: verify-tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # label = user-facing platform name in release assets (AGENTS.md §5);
          # target triples stay internal to build/packaging paths only.
          - name: x86_64-pc-windows-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            archive: zip
          - name: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            archive: tar
          - name: aarch64-linux-android (termux)
            os: ubuntu-latest
            target: aarch64-linux-android
            label: android-arm64
            archive: tar
            android: true
    steps:
      - uses: actions/checkout@v4

      - name: Install BoringSSL build dependencies (linux)
        if: ${{ runner.os == 'Linux' && !matrix.android }}
        run: sudo apt-get update && sudo apt-get install -y cmake perl nasm libclang-dev

      - name: Install BoringSSL build dependencies (android)
        if: matrix.android
        run: sudo apt-get update && sudo apt-get install -y cmake perl ninja-build libclang-dev

      - name: Set up NDK
        if: matrix.android
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      # setup-ndk puts only the NDK root on PATH; the clang wrappers
      # (aarch64-linux-android24-clang) live one level deeper. CC/AR below
      # are bare names and need this to resolve (live-tested 2026-08-30).
      - name: Add NDK clang wrappers to PATH
        if: matrix.android
        run: echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.android && 'aarch64-linux-android' || '' }}

      # Pinned: 4.x renamed the platform flag from `-p` to `-P`/`--platform`
      # and now treats `-p` as cargo's `--package` passthrough (panic:
      # "unknown package: 24").
      - name: Install cargo-ndk
        if: matrix.android
        run: cargo install cargo-ndk --locked --version 4.1.2

      - uses: Swatinem/rust-cache@v2

      - name: Build (native)
        if: ${{ !matrix.android }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (android aarch64, API 24+)
        if: matrix.android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: aarch64-linux-android24-clang
          CXX_aarch64_linux_android: aarch64-linux-android24-clang++
          AR_aarch64_linux_android: llvm-ar
        run: cargo ndk -t arm64-v8a --platform 24 build --release

      - name: Package (windows zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}"
          $stage = "aps2api-$ver-${{ matrix.label }}"
          New-Item -ItemType Directory -Force "$stage" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aps2api.exe" "$stage/"
          Copy-Item "config.example.yaml" "$stage/"
          Copy-Item "model.json" "$stage/"
          Compress-Archive -Path "$stage" -DestinationPath "$stage.zip"
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "$stage.zip.sha256"
          Get-ChildItem "$stage.zip*"

      - name: Package (linux/termux tar.gz, keeps exec bit)
        if: matrix.archive == 'tar'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          STAGE="aps2api-${VERSION}-${{ matrix.label }}"
          mkdir -p "$STAGE"
          if [ "${{ matrix.android }}" = "true" ]; then
            BIN="target/aarch64-linux-android/release/aps2api"
          else
            BIN="target/${{ matrix.target }}/release/aps2api"
          fi
          chmod +x "$BIN"
          cp "$BIN" "$STAGE/"
          cp config.example.yaml model.json "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          sha256sum "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
          ls -la "$STAGE.tar.gz"*

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            aps2api-*-${{ matrix.label }}.zip
            aps2api-*-${{ matrix.label }}.zip.sha256
            aps2api-*-${{ matrix.label }}.tar.gz
            aps2api-*-${{ matrix.label }}.tar.gz.sha256
          generate_release_notes: true

  release:
    name: create GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure release exists with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --generate-notes
